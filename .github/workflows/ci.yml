name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks are named `ci / check` and `ci / browser`, which the main ruleset requires
  ci:
    uses: whatsaaaa/template/.github/workflows/node-ci.yml@v1
    with:
      # Each script builds what it reads from dist/ first. The unit tests in `test` include the
      # contrast of every role pair and that assets/ is up to date.
      scripts: format:check lint type-check test styleguide:build
      # The version of @playwright/test installed, which is the tag of the Playwright image the
      # browser job runs in. tests/playwright-version.test.ts holds the two together. The
      # screenshots in tests/browser/__screenshots__ are taken in this image, so they are compared
      # in it. The browser job's test:browser builds the package and the style guide, then tests
      # the built guide and an app on tailwind.css.
      playwright-version: 1.65.0
      # The files no browser test reads: a pull request that changes only these skips the browser
      # job. Not docs/** or **/*.md, since the style guide renders styleguide/**/*.md and includes
      # docs/usage.md, and the tests open tests/fixtures/**/*.md.
      docs-paths: |
        README.md
        licenses/README.md
        docs/decisions.md
        docs/follow-ups.md
        docs/versioning.md
        .changeset/*.md
